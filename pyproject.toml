[project]
name = "wxpost"
version = "0.1.0"
description = "Tiny WACCM-X post-processor: vertical interpolation, coord transforms, and reductions."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "xarray>=2023.1",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wxpost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "needs_data: test requires the WACCM-X file on /glade",
]
