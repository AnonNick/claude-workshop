[project]
name = "wxpost"
version = "0.1.0"
description = "Tiny WACCM-X post-processor: vertical interpolation, coord transforms, and reductions."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wxpost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Benign ABI warning from cftime/netCDF4 built against an older numpy.
    # Not ours, and it only distracts from the two intentional failures.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
